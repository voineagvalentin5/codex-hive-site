 if(host){var top=el.offsetTop-tr.offsetTop-(tr.clientHeight-el.offsetHeight)/3;tr.scrollTo({top:Math.max(0,top)})}
 else{var sc=tr.parentNode;if(sc.scrollHeight>sc.clientHeight+2){sc.scrollTo({top:Math.max(0,el.offsetTop-sc.clientHeight/3)})}}
}
function update(){
 var t=a.currentTime,dur=a.duration||0,i=find(t);
 if(i!==cw){
  if(cw>=0)words[cw].classList.remove('cur');
  var inWord=t<=D[i][2]+0.15||true;
  words[i].classList.add('cur');cw=i;
  var si=D[i][3];
  if(si!==cs){if(cs>=0)sents[cs].classList.remove('on');sents[si].classList.add('on');cs=si}
  var pi=D[i][4];
  var first=curP===-1;if(pi!==curP){curP=pi;if(!first&&Date.now()>userScroll)scrollTo(paras[pi])}
 }
 if(dur){var sk=$('chp-seek');if(!sk._d){sk.value=t/dur*1000;sk.style.setProperty('--p',(t/dur*100)+'%')}
  $('chp-el').textContent=fmt(t);$('chp-rem').textContent='-'+fmt(dur-t)}
}
function tick(){update();if(!a.paused)requestAnimationFrame(tick)}
function setIcon(){var pl=!a.paused;pp.setAttribute('aria-label',pl?'Pause':'Play');ic.innerHTML=pl?'<path fill="currentColor" d="M6 5h4v14H6zm8 0h4v14h-4z"/>':'<path fill="currentColor" d="M8 5v14l11-7z"/>'}
function toggle(){a.paused?a.play():a.pause()}
pp.onclick=toggle;
a.addEventListener('play',function(){setIcon();tick()});
a.addEventListener('pause',setIcon);
a.addEventListener('timeupdate',update);
a.addEventListener('seeked',update);
a.addEventListener('loadedmetadata',update);
$('chp-back').onclick=function(){a.currentTime=Math.max(0,a.currentTime-15)};
$('chp-fwd').onclick=function(){a.currentTime=Math.min(a.duration||1e9,a.currentTime+15)};
var sp=[0.75,1,1.25,1.5,2],si=1;
$('chp-sp').onclick=function(){si=(si+1)%sp.length;a.playbackRate=sp[si];this.textContent=sp[si]+'x'};
var sk=$('chp-seek');
sk.addEventListener('input',function(){sk._d=1;if(a.duration){a.currentTime=sk.value/1000*a.duration;sk.style.setProperty('--p',(sk.value/10)+'%')}});
sk.addEventListener('change',function(){sk._d=0});
sk.addEventListener('pointerup',function(){sk._d=0});
var vol=$('chp-vol');vol.addEventListener('input',function(){a.volume=vol.value;vol.style.setProperty('--p',(vol.value*100)+'%')});
vol.style.setProperty('--p','100%');
tr.addEventListener('click',function(e){
 var w=e.target.closest('.chp-w');if(w){userScroll=0;a.currentTime=parseFloat(w.dataset.t);a.play();return}
 var s=e.target.closest('.chp-s');if(s){var f=s.querySelector('.chp-w');a.currentTime=parseFloat(f.dataset.t);a.play()}
});
['wheel','touchmove'].forEach(function(ev){tr.addEventListener(ev,function(){userScroll=Date.now()+4000},{passive:true})});
document.addEventListener('keydown',function(e){
 if(e.code!=='Space'&&e.key!==' ')return;
 var t=e.target,tag=t&&t.tagName;
 if(tag==='BUTTON'||tag==='INPUT'&&t.type!=='range'||tag==='TEXTAREA'||tag==='SELECT')return;
 if(!root.contains(t)&&t!==document.body)return;
 e.preventDefault();toggle();
});
update();
window.chpPlayer=a;
})();

</script>
</div>
</body>
