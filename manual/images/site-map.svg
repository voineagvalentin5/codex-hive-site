<text x="125" y="122" text-anchor="middle" class="s">LAPTOP-G96VQ5Q2</text>
<text x="125" y="146" text-anchor="middle" class="s">Edit files in VS Code</text>
<text x="125" y="168" text-anchor="middle" class="s">Commit + Push in</text>
<text x="125" y="186" text-anchor="middle" class="s">GitHub Desktop</text>
