<text x="780" y="124" text-anchor="middle" class="s">codex-hive.com is registered here (paid to Jul 18, 2028).</text>
<text x="780" y="146" text-anchor="middle" class="s">DNS = the phone book of the internet.</text>
<text x="780" y="168" text-anchor="middle" class="s">It tells browsers: "codex-hive.com and each</text>
<text x="780" y="186" text-anchor="middle" class="s">subdomain live at GitHub". Email (Microsoft 365)</text>
<text x="780" y="204" text-anchor="middle" class="s">records also live here. Do not touch them.</text>
