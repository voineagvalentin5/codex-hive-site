<style>.b{fill:#fff7e0;stroke:#b07a00;stroke-width:2}.g{fill:#eef3ff;stroke:#2f4d8a;stroke-width:2}.d{fill:#eefaf0;stroke:#2b7a3d;stroke-width:2}.p{fill:#f4f4f4;stroke:#555;stroke-width:2}.t{font-size:15px;fill:#111}.s{font-size:12px;fill:#333}.h{font-size:17px;font-weight:bold;fill:#111}.a{stroke:#444;stroke-width:2;fill:none;marker-end:url(#m)}</style>
